name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      falkordb:
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.9.7'
          enable-cache: true
      - run: uv sync --locked --all-extras --python 3.11
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Require the graph database
        run: uv run --locked python -c 'from severance.graph.client import db; assert db().connection.ping()'
      - run: uv run --locked pytest -q -m 'not agent'
      - run: uv build
