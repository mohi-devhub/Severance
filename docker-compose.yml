services:
  falkordb:
    # Verified FalkorDB 4.22.1: GRAPH.COPY, algo.SPpaths, algo.betweenness.
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:${FALKOR_PORT:-6380}:6379"
