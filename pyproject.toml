[project]
name = "severance"
version = "0.1.0"
description = "Severance: graph-backed cloud IAM investigation and remediation"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.140",
  "falkordb",
  "typer",
  "rich",
  "pydantic>=2",
  "pydantic-settings",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
bench = ["matplotlib"]

[project.scripts]
severance = "severance.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "graph: needs a running FalkorDB",
  "agent: needs the Claude API",
]
